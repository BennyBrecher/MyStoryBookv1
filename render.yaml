services:
  - type: web
    name: mystory-web
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask run --host=0.0.0.0 --port=10000"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
    disk:
      - name: uploads
        mountPath: /usr/src/app/pictures/uploads